<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div id="calculadora">
        <div id="display"></div>

        <div id="btn-div1">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
        </div>
        <div id="btn-div2">
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
        </div>
        <div id="btn-div3">
            <button>9</button>
            <button>+</button>
            <button>-</button>
            <button>/</button>
        </div>
        <div id="btn-div4">
            <button>*</button>
            <button>.</button>
            <button><<</button>
            <button>=</button>
        </div>

        <div id="btn-div5">
            <button>C</button>
            <button>(</button>
            <button>)</button>
            <button>0</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
